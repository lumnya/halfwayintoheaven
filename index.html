<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1411">
<title>Lumnya</title>
<script>document.documentElement.classList.add('loading');</script>
<link rel="icon" href="https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/KISS.PNG" type="image/png">

<style>
  :root {
    --bg: #0b1411;
    --accent: #FF95CA;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'Times New Roman', Times, serif;
    background-color: var(--bg);
  }

  body { transition: opacity 0.9s ease; }
  html.loading body { opacity: 0; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url("https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/1.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    z-index: -2;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.12);

    z-index: -1;
  }

  ::selection {
    background: var(--accent);
    color: var(--bg);
  }

  .brand {
    position: fixed;
    top: 1.5rem;
    left: 1.5rem;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .logo {
    width: 520px;
    max-width: 75vw;
    height: auto;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.6));
  }

  nav {
    position: relative;
    z-index: 11;
    margin-top: -3rem;
    margin-left: 2.3rem;
    text-align: left;
  }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  nav li {
    margin: 0.55rem 0;
  }

  nav a,
  nav a:visited {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow:
      0 0 6px rgba(0,0,0,0.7),
      0 0 14px rgba(0,0,0,0.5);
    transition: opacity 0.25s ease, letter-spacing 0.25s ease;
  }

  nav a:hover,
  nav a:visited:hover {
    opacity: 0.7;
    letter-spacing: 0.24em;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .kiss-flash {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .kiss-flash img {
    max-width: 42vw;
    max-height: 42vh;
    opacity: 0;
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.6));
  }

  .kiss-flash.show img {
    animation: kissFlash 1.3s ease-in-out;
  }

  @keyframes kissFlash {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    27%  { opacity: 0; }
    42%  { opacity: 1; }
    58%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .since {
    position: fixed;
    bottom: 1.7rem;
    right: 1.7rem;
    z-index: 10;
    font-family: "Times New Roman", serif;
    font-style: italic;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    color: var(--accent);
    opacity: 0.55;
    text-shadow: 0 0 6px rgba(0,0,0,0.7);
    text-align: right;
    pointer-events: none;
  }

  @media (max-width: 768px) {
    body::after {
      background: rgba(0, 0, 0, 0.1);
    }

    .brand {
      top: 0;
      left: 0;
      padding-top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
      padding-left: calc(env(safe-area-inset-left, 0px) + 1.4rem);
    }

    :root {
      --logo-drop: 12vh;
    }

    .logo {
      width: min(340px, 88vw);
      margin-top: var(--logo-drop);
      margin-bottom: calc(0.5625 * (min(300px, 78vw) - min(340px, 88vw)));
    }

    nav {
      margin-top: calc(clamp(2.5rem, 13vh, 6.5rem) - var(--logo-drop));
      margin-left: 1.1rem;
      padding-left: 1.2rem;
      border-left: 1px solid rgba(255, 149, 202, 0.4);
    }

    nav li {
      margin: 0;
    }

    nav a,
    nav a:visited {
      display: inline-block;
      padding: 0.8rem 0;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      transition: opacity 0.2s ease;
    }

    nav a:hover,
    nav a:visited:hover {
      opacity: 1;
      letter-spacing: 0.2em;
      text-decoration: none;
    }

    nav a:active {
      opacity: 0.55;
    }

    nav li:last-child a {
      font-size: 1.6rem;
      line-height: 1;
      padding: 0.9rem 1.2rem 0.9rem 0;
      letter-spacing: 0;
    }

    .since {
      font-size: 0.78rem;
      opacity: 0.75;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 1.1rem);
      right: calc(env(safe-area-inset-right, 0px) + 1.1rem);
    }

    .kiss-flash img {
      max-width: 62vw;
    }
  }

  @media (max-width: 768px) and (orientation: portrait) {
    body::before {
      background-image: url("https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/1mobile.jpg");
      background-position: center center;
    }
  }

  @media (max-width: 768px), (max-height: 560px) {
    .brand {
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    }

    .brand::-webkit-scrollbar {
      display: none;
    }

    .brand > * {
      flex-shrink: 0;
    }
  }
</style>
</head>

<body>
<div class="since" id="since"></div>

<div class="brand">
  <img class="logo" src="https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/LUMNYA.png" alt="Lumnya">
  <nav>
    <ul>
      <li><a href="https://soundcloud.com/lumnya">SoundCloud</a></li>
      <li><a href="https://open.spotify.com/intl-de/artist/6SQuzrnL9TNuc5pMv41RFq">Spotify</a></li>
      <li><a href="https://youtube.com/@eternalspringmaid">YouTube</a></li>
      <li><a href="https://lumnya.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a></li>
      <li><a href="https://www.instagram.com/eternalspringmaid/">Instagram</a></li>
      <li><a href="mailto:lumnya@outlook.de">Contact</a></li>
      <li><a href="ora.html" id="heart-link">♡</a></li>
    </ul>
  </nav>
</div>

<div class="kiss-flash" id="kiss-flash">
  <img src="https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/KISS.PNG" alt="">
</div>

<script>
  document.getElementById('heart-link').addEventListener('click', function (e) {
    e.preventDefault();
    var destination = this.getAttribute('href');
    var flash = document.getElementById('kiss-flash');
    flash.classList.add('show');
    setTimeout(function () {
      window.location.href = destination;
    }, 1300);
  });

  (function () {
    try {
      var key = 'lumnya_first_visit';
      var stored = localStorage.getItem(key);
      if (!stored) {
        stored = new Date().toISOString();
        localStorage.setItem(key, stored);
      }
      var date = new Date(stored);
      var formatted = date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('since').textContent = 'here since ' + formatted;
    } catch (e) {
    }
  })();

  (function () {
    var base = 'https://raw.githubusercontent.com/lumnya/halfwayintoheaven/main/';
    var mobile = window.matchMedia('(max-width: 768px) and (orientation: portrait)').matches;
    var urls = [base + (mobile ? '1mobile.jpg' : '1.png'), base + 'LUMNYA.png', base + 'KISS.PNG'];
    var shown = false;

    function show() {
      if (shown) return;
      shown = true;
      document.documentElement.classList.remove('loading');
    }

    var left = urls.length;
    urls.forEach(function (u) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) show(); };
      img.src = u;
    });

    setTimeout(show, 4000);
  })();
</script>
</body>
</html>
